<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SARPBC - HTML5 Port</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background: #38bdf8; color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 12px; left: 0; right: 0; display: none; justify-content: space-between; gap: 8px; padding: 0 14px; pointer-events: none; font-weight: 800; z-index: 10; }
    .pill { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.45); padding: 8px 12px; border-radius: 999px; font-size: 13px; }
    #menuBtn, #resetBtn { pointer-events: auto; cursor: pointer; color: #38bdf8; }
    #banner { position: fixed; top: 34%; left: 50%; transform: translate(-50%, -50%); font-size: 64px; font-weight: 900; color: #facc15; text-shadow: 0 4px 18px rgba(0,0,0,0.85); pointer-events: none; z-index: 20; }
    #joyZone { position: fixed; bottom: 24px; left: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(15,23,42,0.35); border: 2px solid rgba(255,255,255,0.6); z-index: 10; display: none; touch-action: none; }
    #joyKnob { position: absolute; top: 36px; left: 36px; width: 44px; height: 44px; border-radius: 50%; background: rgba(56, 189, 248, 0.9); border: 2px solid #fff; pointer-events: none; }
    .actions { position: fixed; bottom: 28px; right: 24px; display: none; gap: 14px; z-index: 10; }
    .btn { width: 78px; height: 78px; border-radius: 50%; background: rgba(15,23,42,0.45); border: 2px solid rgba(255,255,255,0.6); color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }
    .btn.active { background: rgba(56, 189, 248, 0.65); border-color: #fff; }
    .boost { border-color: #f97316; color: #fed7aa; }
    .boost.active { background: rgba(249, 115, 22, 0.7); }
    #controlHint { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:9; color:#fff; background:rgba(15,23,42,.62); border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700; pointer-events:none; white-space:nowrap; }
    @media (pointer:coarse) { #controlHint { display:none; } }
    .boostPad { filter: drop-shadow(0 0 8px rgba(34,211,238,.8)); }
    #menu { position: fixed; inset: 0; background: rgba(15, 35, 45, 0.35); display: flex; flex-direction: column; justify-content: space-between; z-index: 30; }
    .psPanel { background: rgba(18, 28, 36, 0.78); border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; padding: 14px 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.45); }
    .psItem { font-size: 22px; font-weight: 800; color: #e2e8f0; text-shadow: 2px 2px 4px #000; padding: 6px 8px; cursor: pointer; text-align: left; background: none; border: none; width: 100%; }
    .psItem:active, .psItem.hl { color: #facc15; }
    .psFooter { background: rgba(12, 18, 24, 0.85); border-top: 1px solid rgba(255,255,255,0.2); padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px; }
    .swatches { display: flex; gap: 10px; flex-wrap: wrap; padding: 6px 0; }
    .swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="pill">YOU <span id="blueScore">0</span> — <span id="redScore">0</span> <span id="oppLabel">CPU</span></div>
    <button id="menuBtn" class="pill">MENU</button>
    <button id="resetBtn" class="pill">RESET</button>
    <div class="pill">BOOST: <span id="boostVal">100</span>%</div>
  </div>
  <div id="banner"></div>
  <div id="controlHint">WASD / ARROWS · SPACE JUMP · SHIFT BOOST · R RESET</div>
  <canvas id="game"></canvas>
  <div id="joyZone"><div id="joyKnob"></div></div>
  <div class="actions" id="actionBtns">
    <div class="btn" id="jumpBtn">JUMP</div>
    <div class="btn boost" id="boostBtn">BOOST</div>
  </div>
  <div id="menu">
    <div style="text-align:center;padding-top:16px;">
      <div style="font-size:12px;letter-spacing:3px;color:#38bdf8;font-weight:900;text-shadow:0 2px 6px #000;">HTML5 PORT</div>
      <img src="logo.png" alt="SARPBC" style="max-width:72vw;max-height:24vh;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.8));" />
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0 6vw;gap:20px;flex-wrap:wrap;">
      <div class="psPanel" style="min-width:220px;">
        <div id="mainScreen">
          <button class="psItem hl" id="openMatchesBtn">Matches</button>
          <button class="psItem" id="openGarageBtn">Garage</button>
        </div>
        <div id="modeScreen" style="display:none;">
          <button class="psItem hl" id="onlineBtn">Play Online</button>
          <button class="psItem" id="offlineBtn">Offline Match</button>
          <button class="psItem" style="font-size:16px;color:#94a3b8;" onclick="showScreen('mainScreen','Choose Matches or Garage to customize your Battle-Car.')">Back</button>
        </div>
        <div id="offlineScreen" style="display:none;">
          <button class="psItem" id="cpuDiffBtn">CPU: Pro</button>
          <button class="psItem" id="mapBtn">Map: Stadium</button>
          <button class="psItem hl" id="startOfflineBtn">Start Match</button>
          <button class="psItem" style="font-size:16px;color:#94a3b8;" onclick="showScreen('modeScreen','Play Online against another player or Offline vs CPU.')">Back</button>
        </div>
        <div id="garageScreen" style="display:none;">
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <button class="psItem hl" id="tabCar" style="font-size:15px;">1. Car</button>
            <button class="psItem" id="tabColor" style="font-size:15px;">2. Color</button>
          </div>
          <div id="carTabBody">
            <button class="psItem" onclick="selectCar(0)">Octane</button>
            <button class="psItem" onclick="selectCar(1)">Backfire</button>
            <button class="psItem" onclick="selectCar(2)">Scarab</button>
          </div>
          <div id="colorTabBody" class="swatches" style="display:none;">
            <div class="swatch" style="background:#0284c7;" onclick="selectColor('#0284c7','#e0f2fe')"></div>
            <div class="swatch" style="background:#dc2626;" onclick="selectColor('#dc2626','#fee2e2')"></div>
            <div class="swatch" style="background:#16a34a;" onclick="selectColor('#16a34a','#dcfce7')"></div>
            <div class="swatch" style="background:#eab308;" onclick="selectColor('#eab308','#fef9c3')"></div>
            <div class="swatch" style="background:#9333ea;" onclick="selectColor('#9333ea','#f3e8ff')"></div>
            <div class="swatch" style="background:#f8fafc;" onclick="selectColor('#f8fafc','#38bdf8')"></div>
          </div>
          <button class="psItem" style="font-size:16px;color:#94a3b8;" onclick="showScreen('mainScreen','Choose Matches or Garage to customize your Battle-Car.')">Back</button>
        </div>
        <div id="onlineScreen" style="display:none;text-align:center;">
          <img src="loading.png" alt="Loading" style="width:72px;height:72px;object-fit:contain;margin-bottom:6px;" />
          <div id="onlineStatus" style="font-weight:800;color:#facc15;font-size:15px;">Waiting for player...</div>
          <button class="psItem" style="font-size:16px;color:#94a3b8;text-align:center;" id="cancelOnlineBtn">Cancel</button>
        </div>
      </div>
      <div class="psPanel" style="max-width:340px;flex:1;">
        <div id="infoDesc" style="font-size:15px;line-height:1.4;color:#f8fafc;">Jump into an Online match or customize an Offline CPU game!</div>
      </div>
    </div>
    <div class="psFooter">
      <div style="color:#f87171;">● BACK</div>
      <div id="profileLabel">Car: Octane</div>
      <div style="color:#60a5fa;">✕ SELECT</div>
    </div>
  </div>
  <audio id="sfxTheme" src="theme.mp3" preload="auto" loop></audio>
  <audio id="sfxGoal" src="goal.mp3" preload="auto"></audio>
  <audio id="sfxBoost" src="boost.mp3" preload="auto" loop></audio>
  <audio id="sfxCountdown" src="countdown.mp3" preload="auto"></audio>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    const canvas = document.getElementById('game'), ctx = canvas.getContext('2d', { alpha: false });
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    const cam = { x: -38, y: 11, z: 0, yaw: 0, pitch: -0.24 };
    function project(wx, wy, wz) {
      const dx = wx - cam.x, dy = wy - cam.y, dz = wz - cam.z;
      const fx = Math.cos(cam.yaw), fz = Math.sin(cam.yaw);
      const camX = dx * (-fz) + dz * fx, camZ = dx * fx + dz * fz;
      const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
      const camY = dy * cp - camZ * sp, depth = dy * sp + camZ * cp;
      if (depth <= 0.5) return null;
      const fov = Math.min(canvas.width, canvas.height) * 0.85;
      return { x: canvas.width * 0.5 + (camX / depth) * fov, y: canvas.height * 0.5 - (camY / depth) * fov, s: fov / depth };
    }
    function drawQuad(p0, p1, p2, p3, fill, stroke) {
      const a = project(p0.x, p0.y, p0.z), b = project(p1.x, p1.y, p1.z);
      const c = project(p2.x, p2.y, p2.z), d = project(p3.x, p3.y, p3.z);
      if (!a || !b || !c || !d) return;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
    }
    const sfxTheme = document.getElementById('sfxTheme'), sfxGoal = document.getElementById('sfxGoal');
    const sfxBoost = document.getElementById('sfxBoost'), sfxCountdown = document.getElementById('sfxCountdown');
    const banner = document.getElementById('banner'), menuEl = document.getElementById('menu');
    const hudEl = document.getElementById('hud'), joyZone = document.getElementById('joyZone'), actionBtns = document.getElementById('actionBtns');
    let audioUnlocked = false, inMenu = true, kickoffTimer = 0, lastStep = 0;

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      [sfxTheme, sfxGoal, sfxBoost, sfxCountdown].forEach(a => a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(() => {}));
    }
    menuEl.addEventListener('touchstart', () => { if (inMenu && sfxTheme.paused) sfxTheme.play().catch(() => {}); }, { passive: true });
    menuEl.addEventListener('click', () => { if (inMenu && sfxTheme.paused) sfxTheme.play().catch(() => {}); });

    const cars = ['OCTANE', 'BACKFIRE', 'SCARAB'];
    let carIdx = 0, pMainCol = '#0284c7', pTrimCol = '#e0f2fe';
    const diffs = [{ name: 'Rookie', spd: 0.48, turn: 1.6 }, { name: 'Pro', spd: 0.72, turn: 2.5 }, { name: 'All-Star', spd: 0.92, turn: 3.4 }];
    const maps = [
      { name: 'Stadium', sky: '#38bdf8', t1: '#16a34a', t2: '#15803d', line: '#ffffff' },
      { name: 'Urban', sky: '#64748b', t1: '#94a3b8', t2: '#8b95a5', line: '#7c2d12' },
      { name: 'Cosmic', sky: '#050508', t1: '#5b67a2', t2: '#9a5b4a', line: '#cbd5e1' },
      { name: 'Utopia', sky: '#7dd3fc', t1: '#22c55e', t2: '#16a34a', line: '#854d0e' },
      { name: 'Galleon', sky: '#1e293b', t1: '#78350f', t2: '#92400e', line: '#b45309' },
      { name: 'Wasteland', sky: '#713f12', t1: '#eab308', t2: '#ca8a04', line: '#854d0e' }
    ];
    let diffIdx = 1, mapIdx = 0;

    function showScreen(id, desc) {
      ['mainScreen','modeScreen','offlineScreen','garageScreen','onlineScreen'].forEach(s => {
        document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
      });
      if (desc) document.getElementById('infoDesc').textContent = desc;
    }
    window.showScreen = showScreen;
    window.selectCar = (i) => { carIdx = i; document.getElementById('profileLabel').textContent = 'Car: ' + cars.at(i); document.getElementById('infoDesc').textContent = 'Selected ' + cars.at(i) + '! Switch to Tab 2 to pick your paint color.'; };
    window.selectColor = (m, t) => { pMainCol = m; pTrimCol = t; document.getElementById('infoDesc').textContent = 'Paint color updated on your Battle-Car!'; };

    document.getElementById('openMatchesBtn').onclick = () => showScreen('modeScreen', 'Play Online against another player or set up an Offline CPU match.');
    document.getElementById('openGarageBtn').onclick = () => showScreen('garageScreen', 'Customize your Battle-Car chassis and team paint color.');
    document.getElementById('offlineBtn').onclick = () => showScreen('offlineScreen', 'Adjust CPU difficulty and arena map, then hit Start Match.');
    document.getElementById('tabCar').onclick = () => {
      document.getElementById('tabCar').classList.add('hl'); document.getElementById('tabColor').classList.remove('hl');
      document.getElementById('carTabBody').style.display = 'block'; document.getElementById('colorTabBody').style.display = 'none';
    };
    document.getElementById('tabColor').onclick = () => {
      document.getElementById('tabColor').classList.add('hl'); document.getElementById('tabCar').classList.remove('hl');
      document.getElementById('colorTabBody').style.display = 'flex'; document.getElementById('carTabBody').style.display = 'none';
    };
    document.getElementById('cpuDiffBtn').onclick = (e) => { diffIdx = (diffIdx + 1) % diffs.length; e.target.textContent = 'CPU: ' + diffs.at(diffIdx).name; };
    document.getElementById('mapBtn').onclick = (e) => { mapIdx = (mapIdx + 1) % maps.length; e.target.textContent = 'Map: ' + maps.at(mapIdx).name; };

    const joy = { x: 0, y: 0, id: null }, joyKnob = document.getElementById('joyKnob');
    function updateJoy(t) {
      const r = joyZone.getBoundingClientRect();
      const dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
      const dist = Math.min(38, Math.hypot(dx, dy)), ang = Math.atan2(dy, dx);
      joyKnob.style.transform = `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist}px)`;
      joy.x = (Math.cos(ang) * dist) / 38; joy.y = -(Math.sin(ang) * dist) / 38;
    }
    joyZone.addEventListener('touchstart', e => { e.preventDefault(); unlockAudio(); const t = e.changedTouches.item(0); joy.id = t.identifier; updateJoy(t); }, { passive: false });
    joyZone.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === joy.id) updateJoy(t); }, { passive: false });
    const resetJoy = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.id = null; joy.x = 0; joy.y = 0; joyKnob.style.transform = 'translate(0,0)'; } };
    joyZone.addEventListener('touchend', resetJoy); joyZone.addEventListener('touchcancel', resetJoy);

    let boosting = false, blueScore = 0, redScore = 0, isOnline = false, isHost = false, peer = null, conn = null;
    const p1 = { x: -24, y: 0, z: 0, vx: 0, vy: 0, vz: 0, yaw: 0, jumps: 2, boost: 100 };
    const opp = { x: 24, y: 0, z: 0, vx: 0, vy: 0, vz: 0, yaw: Math.PI, jumps: 2, boost: 100, car: 0, col: '#dc2626', trim: '#fee2e2' };
    const ball = { x: 0, y: 6, z: 0, vx: 0, vy: 0, vz: 0, r: 2.6 };
    const flames = [];
    const keys = Object.create(null);
    let jumpQueued = false;
    const boostPads = [];
    for (const x of [-34, -17, 0, 17, 34]) for (const z of [-19, 0, 19]) boostPads.push({ x, z, amount: (x === 0 || z === 0) ? 12 : 4, cooldown: 0 });

    function resetPositions() {
      Object.assign(p1, { x: isOnline && !isHost ? 24 : -24, y: 0, z: 0, vx: 0, vy: 0, vz: 0, yaw: isOnline && !isHost ? Math.PI : 0, jumps: 2, boost: 100 });
      Object.assign(opp, { x: isOnline && !isHost ? -24 : 24, y: 0, z: 0, vx: 0, vy: 0, vz: 0, yaw: isOnline && !isHost ? 0 : Math.PI, jumps: 2, boost: 100 });
      Object.assign(ball, { x: 0, y: 7, z: 0, vx: 0, vy: 0, vz: 0 });
      flames.length = 0; kickoffTimer = 4.0; lastStep = 0;
    }

    function launchMatch() {
      unlockAudio(); sfxTheme.pause(); sfxTheme.currentTime = 0;
      inMenu = false; menuEl.style.display = 'none';
      hudEl.style.display = 'flex'; joyZone.style.display = 'block'; actionBtns.style.display = 'flex';
      blueScore = 0; redScore = 0;
      document.getElementById('blueScore').textContent = 0; document.getElementById('redScore').textContent = 0;
      document.getElementById('oppLabel').textContent = isOnline ? 'P2' : 'CPU';
      resetPositions();
    }

    document.getElementById('startOfflineBtn').onclick = () => { isOnline = false; launchMatch(); };
    document.getElementById('menuBtn').onclick = () => {
      inMenu = true; showScreen('mainScreen', 'Jump into an Online match or customize an Offline CPU game!');
      menuEl.style.display = 'flex'; hudEl.style.display = 'none'; joyZone.style.display = 'none'; actionBtns.style.display = 'none';
      sfxBoost.pause(); sfxTheme.currentTime = 0; sfxTheme.play().catch(() => {});
      if (peer) { peer.destroy(); peer = null; conn = null; }
    };
    document.getElementById('resetBtn').onclick = () => { if (!isOnline) { blueScore = 0; redScore = 0; document.getElementById('blueScore').textContent = 0; document.getElementById('redScore').textContent = 0; resetPositions(); } };

    const LOBBY_ID = 'sarpbc-html5-public-lobby-1';
    function setupConn(c, hostFlag) {
      conn = c; isHost = hostFlag; isOnline = true;
      conn.on('open', () => { conn.send({ type: 'meta', car: carIdx, col: pMainCol, trim: pTrimCol }); launchMatch(); });
      conn.on('close', () => { if (isOnline && !inMenu) { banner.textContent = 'PLAYER LEFT'; setTimeout(() => { banner.textContent = ''; }, 1800); } });
      conn.on('data', d => {
        if (d.type === 'meta') { opp.car = d.car; opp.col = d.col; opp.trim = d.trim; }
        else if (d.type === 'state') {
          Object.assign(opp, d.p);
          if (!isHost) { Object.assign(ball, d.b); blueScore = d.s2; redScore = d.s1; document.getElementById('blueScore').textContent = blueScore; document.getElementById('redScore').textContent = redScore; }
        }
      });
    }
    function startOnlineSearch() {
      peer = new Peer(LOBBY_ID);
      peer.on('open', () => { peer.on('connection', c => setupConn(c, true)); });
      peer.on('error', () => { peer = new Peer(); peer.on('open', () => { setupConn(peer.connect(LOBBY_ID), false); }); });
    }
    document.getElementById('onlineBtn').onclick = () => {
      unlockAudio(); showScreen('onlineScreen', 'Searching for another player online...');
      document.getElementById('onlineStatus').textContent = 'Waiting for player...';
      if (typeof Peer !== 'undefined') { startOnlineSearch(); return; }
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
      s.onload = startOnlineSearch;
      s.onerror = () => { document.getElementById('onlineStatus').textContent = 'No internet connection'; };
      document.body.appendChild(s);
    };
    document.getElementById('cancelOnlineBtn').onclick = () => { if (peer) { peer.destroy(); peer = null; } showScreen('modeScreen', 'Play Online against another player or Offline vs CPU.'); };

    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright',' ','shift'].includes(k)) e.preventDefault();
      keys[k] = true;
      if ((k === ' ' || k === 'x') && !e.repeat) jumpQueued = true;
      if (k === 'r' && !inMenu && !isOnline) document.getElementById('resetBtn').click();
    }, { passive: false });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { for (const k of Object.keys(keys)) keys[k] = false; boosting = false; });
    const bBtn = document.getElementById('boostBtn');
    bBtn.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; e.preventDefault(); unlockAudio(); boosting = true; bBtn.classList.add('active'); });
    window.addEventListener('pointerup', () => { boosting = false; bBtn.classList.remove('active'); });
    bBtn.addEventListener('touchstart', e => { e.preventDefault(); unlockAudio(); boosting = true; bBtn.classList.add('active'); }, { passive: false });
    bBtn.addEventListener('touchend', e => { e.preventDefault(); boosting = false; bBtn.classList.remove('active'); sfxBoost.pause(); sfxBoost.currentTime = 0; }, { passive: false });

    const doJump = () => { unlockAudio();
      if (p1.jumps > 0 && kickoffTimer <= 1) {
        p1.vy = 16;
        if (p1.jumps === 1) { p1.vx += Math.cos(p1.yaw) * 18; p1.vz += Math.sin(p1.yaw) * 18; }
        p1.jumps--;
      }
    };
    document.getElementById('jumpBtn').addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; e.preventDefault(); doJump(); });
    document.getElementById('jumpBtn').addEventListener('touchstart', e => { e.preventDefault(); doJump(); }, { passive: false });

    const wheelCoords = [{x:-1.35,z:-1.25}, {x:1.35,z:-1.25}, {x:-1.35,z:1.25}, {x:1.35,z:1.25}];
    function drawCar(c, type, mainCol, trimCol) {
      const cy = Math.cos(c.yaw), sy = Math.sin(c.yaw);
      const pt = (lx, ly, lz) => ({ x: c.x + lx * cy - lz * sy, y: c.y + ly, z: c.z + lx * sy + lz * cy });
      wheelCoords.forEach(w => {
        const p = pt(w.x, 0.55, w.z), wp = project(p.x, p.y, p.z);
        if (wp) { ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(wp.x, wp.y, 0.58 * wp.s, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = type === 'BACKFIRE' ? '#f8fafc' : '#64748b'; ctx.lineWidth = Math.max(1.5, 0.14 * wp.s); ctx.stroke(); }
      });
      const hull = (x0, x1, y0, y1, z0, z1, col, line) => {
        drawQuad(pt(x0,y1,z0), pt(x1,y1,z0), pt(x1,y1,z1), pt(x0,y1,z1), col, line);
        drawQuad(pt(x0,y0,z0), pt(x1,y0,z0), pt(x1,y1,z0), pt(x0,y1,z0), col, line);
        drawQuad(pt(x0,y0,z1), pt(x1,y0,z1), pt(x1,y1,z1), pt(x0,y1,z1), col, line);
        drawQuad(pt(x0,y0,z0), pt(x0,y1,z0), pt(x0,y1,z1), pt(x0,y0,z1), col, line);
        drawQuad(pt(x1,y0,z0), pt(x1,y1,z0), pt(x1,y1,z1), pt(x1,y0,z1), col, line);
      };
      if (type === 'SCARAB') {
        hull(-1.5, 1.5, 0.45, 1.15, -1.0, 1.0, mainCol, trimCol);
        hull(-1.1, 1.1, 1.15, 1.75, -0.82, 0.82, '#0f172a', trimCol);
        const d = pt(0.1, 1.55, 0), dome = project(d.x, d.y, d.z);
        if (dome) { ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(dome.x, dome.y, 0.85 * dome.s, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = trimCol; ctx.lineWidth = 2; ctx.stroke(); }
      } else if (type === 'BACKFIRE') {
        hull(-1.9, 2.0, 0.4, 1.05, -0.88, 0.88, mainCol, trimCol);
        hull(-1.5, -0.1, 1.05, 1.9, -0.82, 0.82, trimCol, '#fff');
        hull(0.3, 1.4, 1.05, 1.5, -0.42, 0.42, '#94a3b8', '#fff');
      } else {
        hull(-1.8, 0.6, 0.45, 1.15, -0.95, 0.95, mainCol, trimCol);
        hull(0.6, 1.95, 0.45, 0.88, -0.85, 0.85, mainCol, trimCol);
        hull(-0.9, 0.65, 1.15, 1.82, -0.75, 0.75, '#0f172a', trimCol);
        hull(-2.15, -1.6, 1.62, 1.82, -1.08, 1.08, mainCol, '#fff');
      }
    }

    function stepCar(c, steer, throttle, isBoost, dt) {
      const grounded = c.y <= 0.015;
      const speed = Math.hypot(c.vx, c.vz);
      if (grounded) { c.y = 0; c.jumps = 2; c.boost = Math.min(100, c.boost + 7 * dt); }
      // Steering authority builds with speed; reverse steering naturally flips.
      const forwardSpeed = c.vx * Math.cos(c.yaw) + c.vz * Math.sin(c.yaw);
      const steerGrip = grounded ? (0.22 + Math.min(speed / 18, 1) * 0.78) : 0.34;
      c.yaw += steer * (grounded ? 2.25 : 1.15) * steerGrip * (forwardSpeed < -1 ? -1 : 1) * dt;
      const accel = throttle * (grounded ? 31 : 11);
      c.vx += Math.cos(c.yaw) * accel * dt; c.vz += Math.sin(c.yaw) * accel * dt;
      if (isBoost && c.boost > 0) {
        c.vx += Math.cos(c.yaw) * 48 * dt; c.vz += Math.sin(c.yaw) * 48 * dt;
        c.boost = Math.max(0, c.boost - 32 * dt);
        if (flames.length < 55) flames.push({ x: c.x - Math.cos(c.yaw)*2.1, y: c.y + 0.9, z: c.z - Math.sin(c.yaw)*2.1, vx: -Math.cos(c.yaw)*14 + (Math.random()-0.5)*4, vy: 2 + Math.random()*3, vz: -Math.sin(c.yaw)*14 + (Math.random()-0.5)*4, life: 0.35 });
        if (c === p1 && sfxBoost.paused) sfxBoost.play().catch(() => {});
      } else if (c === p1 && !sfxBoost.paused) { sfxBoost.pause(); sfxBoost.currentTime = 0; }
      // Ground traction and air drag are deliberately different for controllable aerials.
      const drag = grounded ? (Math.abs(throttle) > 0.05 ? 0.82 : 0.68) : 0.985;
      c.vx *= Math.pow(drag, dt); c.vz *= Math.pow(drag, dt);
      const maxSpeed = isBoost ? 43 : 29;
      const currentSpeed = Math.hypot(c.vx, c.vz);
      if (currentSpeed > maxSpeed) { c.vx *= maxSpeed/currentSpeed; c.vz *= maxSpeed/currentSpeed; }
      c.vy -= 30 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.z += c.vz * dt;
      if (c.y < 0) { c.y = 0; if (c.vy < -2) { c.vy *= -0.12; } else c.vy = 0; }
      // Arena side walls: cars rebound rather than passing through the field boundary.
      if (c.x < -46) { c.x = -46; c.vx = Math.abs(c.vx) * 0.35; }
      if (c.x > 46) { c.x = 46; c.vx = -Math.abs(c.vx) * 0.35; }
      if (c.z < -28) { c.z = -28; c.vz = Math.abs(c.vz) * 0.35; }
      if (c.z > 28) { c.z = 28; c.vz = -Math.abs(c.vz) * 0.35; }

      // Real boost-pad pickups, with a short respawn delay.
      if (c === p1 || (!isOnline && c === opp)) {
        for (const pad of boostPads) {
          if (pad.cooldown <= 0 && Math.hypot(c.x-pad.x, c.z-pad.z) < 2.35 && c.boost < 100) {
            c.boost = Math.min(100, c.boost + pad.amount); pad.cooldown = 4.5;
          }
        }
      }
      if (!isOnline || isHost) {
        const dx = ball.x - c.x, dy = ball.y - (c.y + 1.2), dz = ball.z - c.z, dist = Math.hypot(dx, dy, dz);
        if (dist < ball.r + 2.2 && dist > 0.01) {
          const nx = dx / dist, ny = dy / dist, nz = dz / dist;
          const approach = Math.max(0, c.vx*nx + c.vy*ny + c.vz*nz);
          ball.x = c.x + nx * (ball.r + 2.2); ball.y = (c.y + 1.2) + ny * (ball.r + 2.2); ball.z = c.z + nz * (ball.r + 2.2);
          const hit = 10 + speed * 0.72 + approach * 0.55 + (isBoost ? 5 : 0);
          ball.vx = nx * hit + c.vx * 0.48; ball.vy = Math.max(3, ny * hit + Math.max(0,c.vy)*0.35 + 3); ball.vz = nz * hit + c.vz * 0.48;
        }
      }
    }

    function drawGoalBox(gx, dir, fill, stroke) {
      const bx = gx + dir * 6;
      drawQuad({x:bx,y:0,z:-9}, {x:bx,y:9.5,z:-9}, {x:bx,y:9.5,z:9}, {x:bx,y:0,z:9}, fill, stroke);
      drawQuad({x:gx,y:9.5,z:-9}, {x:bx,y:9.5,z:-9}, {x:bx,y:9.5,z:9}, {x:gx,y:9.5,z:9}, fill, stroke);
      drawQuad({x:gx,y:0,z:-9}, {x:bx,y:0,z:-9}, {x:bx,y:9.5,z:-9}, {x:gx,y:9.5,z:-9}, fill, stroke);
      drawQuad({x:gx,y:0,z:9}, {x:bx,y:0,z:9}, {x:bx,y:9.5,z:9}, {x:gx,y:9.5,z:9}, fill, stroke);
    }

    let last = performance.now();
    resetPositions();

    function loop(now) {
      const dt = Math.min(Math.max((now - last) / 1000, 0.001), 0.05); last = now;
      let frozen = false;
      if (!inMenu && kickoffTimer > 0) {
        kickoffTimer -= dt;
        const step = Math.ceil(kickoffTimer);
        if (step !== lastStep && step >= 1 && audioUnlocked) { lastStep = step; sfxCountdown.currentTime = 0; sfxCountdown.play().catch(() => {}); }
        banner.textContent = step === 4 ? '3' : step === 3 ? '2' : step === 2 ? '1' : step === 1 ? 'GO!' : '';
        frozen = step > 1;
      } else banner.textContent = '';

      if (!inMenu && !frozen) {
        for (const pad of boostPads) if (pad.cooldown > 0) pad.cooldown = Math.max(0, pad.cooldown - dt);
        const keySteer = (keys['a'] || keys['arrowleft'] ? -1 : 0) + (keys['d'] || keys['arrowright'] ? 1 : 0);
        const keyThrottle = (keys['w'] || keys['arrowup'] ? 1 : 0) + (keys['s'] || keys['arrowdown'] ? -1 : 0);
        const steerInput = Math.abs(joy.x) > 0.08 ? joy.x : keySteer;
        const throttle = Math.abs(joy.y) > 0.1 ? joy.y : keyThrottle;
        const boostingNow = boosting || keys['shift'] || keys['z'];
        if (jumpQueued) { doJump(); jumpQueued = false; }
        stepCar(p1, steerInput, throttle, boostingNow, dt);

        if (!isOnline) {
          const d = diffs.at(diffIdx);
          const desiredYaw = Math.atan2(ball.z - opp.z, Math.min(44, ball.x + 3.5) - opp.x);
          const diff = Math.atan2(Math.sin(desiredYaw - opp.yaw), Math.cos(desiredYaw - opp.yaw));
          const cpuDist = Math.hypot(ball.x - opp.x, ball.z - opp.z);
          if (cpuDist < 7 && ball.y > 2.8 && opp.jumps > 0 && opp.y <= 0.01) { opp.vy = 15; opp.jumps--; }
          stepCar(opp, Math.max(-1, Math.min(1, diff * d.turn)), d.spd, Math.abs(diff) < 0.35 && cpuDist > 10 && opp.boost > 4, dt);
        }

        if (!isOnline || isHost) {
          ball.vy -= 24 * dt; ball.x += ball.vx * dt; ball.y += ball.vy * dt; ball.z += ball.vz * dt; ball.vx *= Math.pow(0.995,dt); ball.vz *= Math.pow(0.995,dt);
          if (ball.y < ball.r) { ball.y = ball.r; ball.vy = -ball.vy * 0.72; ball.vx *= 0.97; ball.vz *= 0.97; }
          if (ball.y > 24) { ball.y = 24; ball.vy = -ball.vy * 0.8; }
          if (Math.abs(ball.z) > 27.4) { ball.z = Math.sign(ball.z) * 27.4; ball.vz = -ball.vz * 0.82; }
          if (Math.abs(ball.x) > 45.4) {
            if (Math.abs(ball.z) < 8.5 && ball.y < 9.5) {
              if (ball.x > 0) { blueScore++; document.getElementById('blueScore').textContent = blueScore; }
              else { redScore++; document.getElementById('redScore').textContent = redScore; }
              sfxGoal.currentTime = 0; sfxGoal.play().catch(() => {});
              resetPositions();
            } else { ball.x = Math.sign(ball.x) * 45.4; ball.vx = -ball.vx * 0.82; }
          }
        }
        if (isOnline && conn && conn.open) conn.send({ type: 'state', p: { x: p1.x, y: p1.y, z: p1.z, yaw: p1.yaw }, b: ball, s1: blueScore, s2: redScore });
      }

      if (inMenu) {
        const ang = now * 0.00035;
        cam.x = p1.x + Math.cos(ang) * 9; cam.y = 4.5; cam.z = p1.z + Math.sin(ang) * 9;
        cam.yaw = Math.atan2(p1.z - cam.z, p1.x - cam.x); cam.pitch = -0.22;
      } else {
        const tx = p1.x - Math.cos(p1.yaw) * 16, tz = p1.z - Math.sin(p1.yaw) * 16;
        cam.x += (tx - cam.x) * 8 * dt; cam.y += (p1.y + 9 - cam.y) * 8 * dt; cam.z += (tz - cam.z) * 8 * dt;
        cam.yaw = Math.atan2((p1.z + Math.sin(p1.yaw) * 12) - cam.z, (p1.x + Math.cos(p1.yaw) * 12) - cam.x);
        cam.pitch = -0.25;
      }

      const m = maps.at(mapIdx);
      ctx.fillStyle = m.sky; ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let gx = -48; gx < 48; gx += 12) {
        for (let gz = -30; gz < 30; gz += 12) {
          if (m.name === 'Utopia' && Math.hypot(gx + 6, gz + 6) < 13) continue;
          let c1 = m.t1, c2 = m.t2, strokeCol = m.name === 'Stadium' ? null : m.line;
          if (m.name === 'Cosmic') { c1 = gx < 0 ? '#5b67a2' : '#9a5b4a'; c2 = c1; }
          drawQuad({x:gx,y:0,z:gz}, {x:gx+12,y:0,z:gz}, {x:gx+12,y:0,z:gz+12}, {x:gx,y:0,z:gz+12}, ((gx+gz)/12)%2===0 ? c1 : c2, strokeCol);
        }
      }

      if (m.name === 'Stadium') {
        drawQuad({x:-48,y:0.02,z:-30}, {x:48,y:0.02,z:-30}, {x:48,y:0.02,z:30}, {x:-48,y:0.02,z:30}, null, '#ffffff');
        drawQuad({x:0,y:0.02,z:-30}, {x:0,y:0.02,z:30}, {x:0.1,y:0.02,z:30}, {x:0.1,y:0.02,z:-30}, '#ffffff', '#ffffff');
        drawQuad({x:-48,y:0.02,z:-15}, {x:-34,y:0.02,z:-15}, {x:-34,y:0.02,z:15}, {x:-48,y:0.02,z:15}, null, '#ffffff');
        drawQuad({x:48,y:0.02,z:-15}, {x:34,y:0.02,z:-15}, {x:34,y:0.02,z:15}, {x:48,y:0.02,z:15}, null, '#ffffff');
        drawQuad({x:-5,y:0.03,z:-5}, {x:0,y:0.03,z:-5}, {x:0,y:0.03,z:5}, {x:-5,y:0.03,z:5}, '#2563eb', '#ffffff');
        drawQuad({x:0,y:0.03,z:-5}, {x:5,y:0.03,z:-5}, {x:5,y:0.03,z:5}, {x:0,y:0.03,z:5}, '#dc2626', '#ffffff');
      } else if (m.name === 'Galleon') {
        [-14, 14].forEach(mx => {
          drawQuad({x:mx-1.2,y:0,z:-1.2}, {x:mx+1.2,y:0,z:-1.2}, {x:mx+1.2,y:24,z:-1.2}, {x:mx-1.2,y:24,z:-1.2}, '#451a03', '#fbbf24');
          drawQuad({x:mx-1.2,y:0,z:1.2}, {x:mx+1.2,y:0,z:1.2}, {x:mx+1.2,y:24,z:1.2}, {x:mx-1.2,y:24,z:1.2}, '#451a03', '#fbbf24');
        });
      }

      const blueX = m.name === 'Utopia' ? -12 : -48, redX = m.name === 'Utopia' ? 12 : 48;
      drawGoalBox(blueX, m.name === 'Utopia' ? 1 : -1, 'rgba(37,99,235,0.35)', '#3b82f6');

drawGoalBox(redX, m.name === 'Utopia' ? -1 : 1, 'rgba(220,38,38,0.35)', '#ef4444');
for (let i = flames.length - 1; i >= 0; i--) {
const f = flames.at(i); f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt; f.life -= dt;
if (f.life <= 0) { flames.splice(i, 1); continue; }
const fp = project(f.x, f.y, f.z);
if (fp) { ctx.fillStyle = f.life > 0.18 ? '#f97316' : '#facc15'; ctx.beginPath(); ctx.arc(fp.x, fp.y, (f.life * 2.1) * fp.s, 0, Math.PI * 2); ctx.fill(); }
}

[
{ z: Math.hypot(p1.x - cam.x, p1.z - cam.z), fn: () => drawCar(p1, cars.at(carIdx), pMainCol, pTrimCol) },
{ z: Math.hypot(opp.x - cam.x, opp.z - cam.z), fn: () => drawCar(opp, isOnline ? cars.at(opp.car) : 'OCTANE', isOnline ? opp.col : '#dc2626', isOnline ? opp.trim : '#fee2e2') },
{ z: Math.hypot(ball.x - cam.x, ball.z - cam.z), fn: () => {
const bp = project(ball.x, ball.y, ball.z), sp = project(ball.x, 0.05, ball.z);
if (sp) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(sp.x, sp.y, Math.max(2, ball.r * sp.s * 0.9), Math.max(1, ball.r * sp.s * 0.32), 0, 0, Math.PI * 2); ctx.fill(); }
if (bp) { ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(bp.x, bp.y, Math.max(2, ball.r * bp.s), 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#0284c7'; ctx.lineWidth = Math.max(1.5, bp.s * 0.12); ctx.stroke(); }
}}
].sort((a, b) => b.z - a.z).forEach(i => i.fn());



document.getElementById('boostVal').textContent = Math.round(p1.boost);
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
